<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tournois - Tournament Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <nav th:replace="~{fragments/sidebar :: sidebar('tournaments')}"></nav>
    <div class="flex-grow-1 app-main">
        <main class="app-content">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="page-hero d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="hero-icon"><i class="fas fa-trophy"></i></div>
                    <div>
                        <h1>Tournois</h1>
                        <p>Gérez vos compétitions et leurs formats</p>
                    </div>
                </div>
                <a th:if="${canManage}" th:href="@{/tournaments/new}" class="btn btn-light fw-semibold">
                    <i class="fas fa-plus me-1"></i> Nouveau tournoi
                </a>
            </div>

            <form th:action="@{/tournaments}" method="get" class="card mb-3">
                <div class="card-body row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label small mb-1" for="filterName">Nom</label>
                        <input id="filterName" type="text" name="name" class="form-control form-control-sm"
                               placeholder="Rechercher un tournoi" th:value="${filterName}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-1" for="filterSport">Sport</label>
                        <input id="filterSport" type="text" name="sport" class="form-control form-control-sm"
                               th:value="${filterSport}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-1" for="filterStatus">Statut</label>
                        <select id="filterStatus" name="status" class="form-select form-select-sm">
                            <option value="">Tous</option>
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                    th:selected="${s == filterStatus}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-1" for="filterSort">Trier par</label>
                        <select id="filterSort" name="sort" class="form-select form-select-sm">
                            <option value="startDate" th:selected="${sort == 'startDate'}">Date de début</option>
                            <option value="name" th:selected="${sort == 'name'}">Nom</option>
                            <option value="sport" th:selected="${sort == 'sport'}">Sport</option>
                            <option value="status" th:selected="${sort == 'status'}">Statut</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <label class="form-label small mb-1" for="filterDirection">Ordre</label>
                        <select id="filterDirection" name="direction" class="form-select form-select-sm">
                            <option value="desc" th:selected="${direction == 'desc'}">Desc</option>
                            <option value="asc" th:selected="${direction == 'asc'}">Asc</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-sm flex-grow-1">
                            <i class="fas fa-filter me-1"></i> Filtrer
                        </button>
                        <a th:href="@{/tournaments}" class="btn btn-outline-secondary btn-sm" title="Réinitialiser">
                            <i class="fas fa-eraser"></i>
                        </a>
                    </div>
                </div>
            </form>

            <div class="card">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Sport</th>
                            <th>Type</th>
                            <th>Pays</th>
                            <th>Lieu</th>
                            <th>Dates</th>
                            <th>Statut</th>
                            <th>Équipes</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="t : ${tournaments}">
                            <td>
                                <strong th:text="${t.name}"></strong>
                            </td>
                            <td th:text="${t.sport}"></td>
                            <td th:text="${t.type}"></td>
                            <td>
                                <span th:if="${t.country != null}" class="badge bg-light text-dark border"
                                      th:text="${t.country.label}"></span>
                                <span th:if="${t.country == null}" class="text-muted small">International</span>
                            </td>
                            <td th:text="${t.location}"></td>
                            <td th:text="${t.startDate} + ' → ' + ${t.endDate}"></td>
                            <td>
                                <span class="badge badge-status"
                                      th:classappend="|bg-${t.status.name() == 'BROUILLON' ? 'secondary' : t.status.name() == 'INSCRIPTION' ? 'info' : t.status.name() == 'PROGRAMME' ? 'primary' : t.status.name() == 'EN_COURS' ? 'warning' : t.status.name() == 'TERMINE' ? 'success' : 'danger'}|"
                                      th:text="${t.status}"></span>
                            </td>
                            <td th:text="${t.registeredTeams} + '/' + ${t.maxTeams}"></td>
                            <td class="text-nowrap">
                                <a th:href="@{/tournaments/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary" title="Voir">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <th:block th:if="${canManage}">
                                    <a th:href="@{/tournaments/{id}/edit(id=${t.id})}" class="btn btn-sm btn-outline-secondary" title="Modifier">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <form th:action="@{/tournaments/{id}/delete(id=${t.id})}" method="post"
                                          style="display:inline;"
                                          onsubmit="return confirm('Supprimer ce tournoi ?');">
                                        <button class="btn btn-sm btn-outline-danger" title="Supprimer">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </th:block>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(tournaments)}">
                            <td colspan="8" class="text-center text-muted py-4">
                                Aucun tournoi enregistré.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 p-3 border-top"
                         th:if="${page.totalPages > 1}">
                        <span class="text-muted small"
                              th:text="|Page ${page.number + 1} / ${page.totalPages} — ${page.totalElements} tournoi(s)|"></span>
                        <nav>
                            <ul class="pagination pagination-sm mb-0">
                                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/tournaments(page=${page.number - 1}, size=${page.size}, status=${filterStatus}, sport=${filterSport}, name=${filterName}, sort=${sort}, direction=${direction})}">Précédent</a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                                    th:classappend="${i == page.number} ? 'active'">
                                    <a class="page-link"
                                       th:href="@{/tournaments(page=${i}, size=${page.size}, status=${filterStatus}, sport=${filterSport}, name=${filterName}, sort=${sort}, direction=${direction})}"
                                       th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/tournaments(page=${page.number + 1}, size=${page.size}, status=${filterStatus}, sport=${filterSport}, name=${filterName}, sort=${sort}, direction=${direction})}">Suivant</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
