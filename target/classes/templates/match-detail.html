<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détail match - Tournament Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <nav th:replace="~{fragments/sidebar :: sidebar('tournaments')}"></nav>
    <div class="flex-grow-1" style="min-height: 100vh;">
        <main class="app-content">
            <div class="page-hero d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="hero-icon"><i class="fas fa-futbol"></i></div>
                    <div>
                        <h1>Détail du match</h1>
                        <p th:text="${match.tournamentName}">Tournoi</p>
                    </div>
                </div>
                <a th:href="@{/tournaments/{id}(id=${match.tournamentId})}" class="btn btn-light fw-semibold">
                    <i class="fas fa-arrow-left"></i> Retour au tournoi
                </a>
            </div>

            <div class="card mb-4">
                <div class="card-body text-center py-4">
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                    <div class="text-muted mb-2">
                        <span th:text="${match.tournamentName}"></span> · 
                        <span th:text="${match.phase}"></span> · 
                        <span th:text="${match.matchDate} + ' ' + ${match.matchTime}"></span> · 
                        <span th:text="${match.field}"></span>
                    </div>
                    <div class="row align-items-center">
                        <div class="col-4">
                            <h4 th:text="${match.homeTeamName}"></h4>
                        </div>
                        <div class="col-4">
                            <div class="display-4 fw-bold">
                                <span th:if="${match.status.name() == 'COMPLETED'}" th:text="${match.homeScore} + ' - ' + ${match.awayScore}"></span>
                                <span th:if="${match.status.name() != 'COMPLETED'}" class="text-muted">VS</span>
                            </div>
                            <div>
                                <span class="badge badge-status"
                                      th:classappend="|bg-${match.status.name() == 'PLANNED' ? 'secondary' : match.status.name() == 'IN_PROGRESS' ? 'warning' : match.status.name() == 'COMPLETED' ? 'success' : 'danger'}|"
                                      th:text="${match.status}"></span>
                            </div>
                        </div>
                        <div class="col-4">
                            <h4 th:text="${match.awayTeamName}"></h4>
                        </div>
                    </div>
                    <div th:if="${match.status.name() == 'COMPLETED' and match.winnerName != null}" class="mt-2">
                        <span class="text-success"><i class="fas fa-trophy"></i> Vainqueur : <strong th:text="${match.winnerName}"></strong></span>
                    </div>
                </div>
            </div>

            <div th:if="${canOperate and match.status.name() != 'CANCELLED'}" class="card">
                <div class="card-header bg-white">
                    <h6 class="mb-0"
                        th:text="${match.status.name() == 'COMPLETED'} ? 'Modifier le résultat (recalcul du classement)' : 'Saisir le résultat'"></h6>
                </div>
                <div class="card-body">
                    <form th:action="@{/matches/{id}/result(id=${match.id})}" method="post" th:object="${resultRequest}"
                          class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label" th:text="${match.homeTeamName}">Domicile</label>
                            <input type="number" th:field="*{homeScore}" class="form-control" min="0" required>
                            <div class="invalid-feedback" th:errors="*{homeScore}"></div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" th:text="${match.awayTeamName}">Visiteur</label>
                            <input type="number" th:field="*{awayScore}" class="form-control" min="0" required>
                            <div class="invalid-feedback" th:errors="*{awayScore}"></div>
                        </div>
                        <div class="col-md-3" th:if="${match.phase.name() != 'GROUP_STAGE' and (match.leg == null or match.leg == 2)}">
                            <label class="form-label" th:text="${match.leg != null} ? 'Tirs au but (si cumulé à égalité)' : 'Tirs au but (si égalité)'">Tirs au but (si égalité)</label>
                            <div class="input-group">
                                <input type="number" th:field="*{homePenalties}" class="form-control" min="0" placeholder="Dom.">
                                <input type="number" th:field="*{awayPenalties}" class="form-control" min="0" placeholder="Ext.">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-success w-100">
                                <i class="fas fa-check"></i> Enregistrer le résultat
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div th:if="${canOperate and match.status.name() != 'COMPLETED' and match.status.name() != 'CANCELLED'}" class="card mt-4">
                <div class="card-header bg-white">
                    <h6 class="mb-0"><i class="fas fa-calendar-plus me-1"></i> Reporter le match</h6>
                </div>
                <div class="card-body">
                    <form th:action="@{/matches/{id}/schedule(id=${match.id})}" method="post" th:object="${scheduleRequest}"
                          class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label">Nouvelle date</label>
                            <input type="date" th:field="*{matchDate}" class="form-control" required>
                            <div class="invalid-feedback" th:errors="*{matchDate}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Heure</label>
                            <input type="time" th:field="*{matchTime}" class="form-control" required>
                            <div class="invalid-feedback" th:errors="*{matchTime}"></div>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Terrain</label>
                            <input type="text" th:field="*{field}" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-warning w-100"><i class="fas fa-clock me-1"></i> Reporter</button>
                        </div>
                    </form>
                </div>
            </div>

            <form th:if="${canManage and match.status.name() != 'COMPLETED' and match.status.name() != 'CANCELLED'}"
                  th:action="@{/matches/{id}/cancel(id=${match.id})}" method="post" class="mt-3"
                  onsubmit="return confirm('Annuler ce match ? Cette action est irréversible.');">
                <button class="btn btn-outline-danger">
                    <i class="fas fa-ban"></i> Annuler le match
                </button>
            </form>
            <div th:if="${match.status.name() == 'CANCELLED'}" class="alert alert-danger mt-3">
                Ce match a été annulé.
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
