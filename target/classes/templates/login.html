<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Tournament Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <style>
        body.login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-image:
                linear-gradient(120deg, rgba(6, 10, 20, .88) 0%, rgba(6, 40, 32, .82) 55%, rgba(16, 185, 129, .55) 100%),
                url('/images/stadium-hero.jpg');
            background-size: cover;
            background-position: center;
        }
        .auth-card {
            width: 100%;
            max-width: 430px;
            border-radius: 22px;
            padding: 2.4rem 2.2rem;
            background: rgba(255, 255, 255, .97);
            box-shadow: 0 30px 70px rgba(2, 6, 23, .55);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            gap: .8rem;
            justify-content: center;
            margin-bottom: .35rem;
        }
        .auth-brand img {
            width: 52px; height: 52px; border-radius: 14px; object-fit: cover;
            box-shadow: 0 10px 22px rgba(16, 185, 129, .4);
        }
        .auth-brand .t { font-family: var(--font-head); font-weight: 800; font-size: 1.7rem; text-transform: uppercase; letter-spacing: 1px; }
        .input-icon { position: relative; }
        .input-icon i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #94a3b8;
        }
        .input-icon .form-control { padding-left: 42px; height: 50px; }
        .demo-pill {
            display: inline-flex; align-items: center; gap: .35rem;
            background: #f1f5f9; border: 1px solid var(--line);
            border-radius: 999px; padding: .25rem .65rem; font-size: .72rem;
            color: var(--ink-soft); cursor: pointer; transition: all .15s ease;
        }
        .demo-pill:hover { background: #ecfdf5; border-color: #a7f3d0; color: var(--emerald-dark); }
    </style>
</head>
<body class="login-page">
<div class="auth-card">
    <div class="auth-brand">
        <img th:src="@{/images/logo-mark.jpg}" alt="Tournament">
        <div class="t">Tournament<span class="text-success">.</span></div>
    </div>
    <p class="text-center text-muted mb-4">Plateforme de gestion de tournois &amp; compétitions</p>

    <div th:if="${param.logout}" class="alert alert-success py-2"><i class="fas fa-check-circle me-1"></i> Vous avez été déconnecté.</div>
    <div th:if="${param.error}" class="alert alert-danger py-2"><i class="fas fa-triangle-exclamation me-1"></i> Identifiants incorrects.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3 input-icon">
            <i class="fas fa-user"></i>
            <input type="text" name="username" class="form-control" placeholder="Nom d'utilisateur" required autofocus>
        </div>
        <div class="mb-4 input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" class="form-control" placeholder="Mot de passe" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="fas fa-right-to-bracket me-1"></i> Se connecter
        </button>
    </form>

    <div class="text-center mt-4">
        <div class="text-muted small mb-2">Comptes de démonstration</div>
        <div class="d-flex flex-wrap gap-2 justify-content-center">
            <span class="demo-pill" data-u="admin" data-p="admin123"><i class="fas fa-user-shield"></i> admin</span>
            <span class="demo-pill" data-u="manager" data-p="manager123"><i class="fas fa-user-tie"></i> manager</span>
            <span class="demo-pill" data-u="operator" data-p="operator123"><i class="fas fa-headset"></i> operator</span>
            <span class="demo-pill" data-u="user" data-p="user123"><i class="fas fa-user"></i> user</span>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll('.demo-pill').forEach(function (el) {
        el.addEventListener('click', function () {
            document.querySelector('input[name="username"]').value = el.dataset.u;
            document.querySelector('input[name="password"]').value = el.dataset.p;
        });
    });
</script>
</body>
</html>
