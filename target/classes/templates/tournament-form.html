<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire tournoi - Tournament Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <nav th:replace="~{fragments/sidebar :: sidebar('tournaments')}"></nav>
    <div class="flex-grow-1" style="min-height: 100vh;">
        <main class="app-content">
            <div class="page-hero d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="hero-icon"><i class="fas" th:classappend="${isEdit} ? 'fa-edit' : 'fa-plus'"></i></div>
                    <div>
                        <h1 th:text="${isEdit} ? 'Modifier le tournoi' : 'Nouveau tournoi'"></h1>
                        <p>Configurez la compétition et son format</p>
                    </div>
                </div>
                <a th:href="@{/tournaments}" class="btn btn-light fw-semibold">
                    <i class="fas fa-arrow-left me-1"></i> Retour
                </a>
            </div>

            <div class="card">
                <div class="card-body">
                    <form th:if="${!isEdit}" th:action="@{/tournaments}" method="post"
                          th:object="${tournament}" class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nom du tournoi *</label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Sport *</label>
                            <input type="text" th:field="*{sport}" class="form-control"
                                   th:classappend="${#fields.hasErrors('sport')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{sport}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date de début *</label>
                            <input type="date" th:field="*{startDate}" class="form-control"
                                   th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{startDate}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date de fin *</label>
                            <input type="date" th:field="*{endDate}" class="form-control"
                                   th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{endDate}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Lieu *</label>
                            <input type="text" th:field="*{location}" class="form-control"
                                   th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{location}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Pays <small class="text-muted">(ligue nationale = auto-inscription des clubs)</small></label>
                            <select th:field="*{country}" class="form-select">
                                <option value="">— Aucun (international) —</option>
                                <option th:each="c : ${countries}" th:value="${c.name()}" th:text="${c.label}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Max équipes *</label>
                            <input type="number" th:field="*{maxTeams}" class="form-control" min="2"
                                   th:classappend="${#fields.hasErrors('maxTeams')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{maxTeams}"></div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Type *</label>
                            <select th:field="*{type}" class="form-select"
                                    th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
                                <option th:each="type : ${types}" th:value="${type}" th:text="${type}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{type}"></div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Points victoire</label>
                            <input type="number" th:field="*{pointsWin}" class="form-control" min="0">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Points nul</label>
                            <input type="number" th:field="*{pointsDraw}" class="form-control" min="0">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Points défaite</label>
                            <input type="number" th:field="*{pointsLoss}" class="form-control" min="0">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Critères de départage (dans l'ordre, séparés par des virgules)</label>
                            <input type="text" th:field="*{tiebreakers}" class="form-control"
                                   placeholder="GOAL_DIFFERENCE,GOALS_FOR,HEAD_TO_HEAD">
                            <div class="form-text">
                                Valeurs possibles : WINS, GOAL_DIFFERENCE, GOALS_FOR, GOALS_AGAINST, HEAD_TO_HEAD.
                            </div>
                        </div>
                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Créer le tournoi
                            </button>
                        </div>
                    </form>

                    <form th:if="${isEdit}" th:action="@{/tournaments/{id}/edit(id=${tournament.id})}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nom du tournoi</label>
                                <input type="text" name="name" class="form-control" th:value="${tournament.name}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Sport</label>
                                <input type="text" name="sport" class="form-control" th:value="${tournament.sport}">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Description</label>
                                <textarea name="description" class="form-control" rows="3"
                                          th:text="${tournament.description}"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Date de début</label>
                                <input type="date" name="startDate" class="form-control" th:value="${tournament.startDate}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Date de fin</label>
                                <input type="date" name="endDate" class="form-control" th:value="${tournament.endDate}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Lieu</label>
                                <input type="text" name="location" class="form-control" th:value="${tournament.location}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Pays <small class="text-muted">(ligue nationale = auto-inscription des clubs)</small></label>
                                <select name="country" class="form-select">
                                    <option value="">— Aucun (international) —</option>
                                    <option th:each="c : ${countries}" th:value="${c.name()}" th:text="${c.label}"
                                            th:selected="${tournament.country != null and tournament.country.name() == c.name()}"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Max équipes</label>
                                <input type="number" name="maxTeams" class="form-control" th:value="${tournament.maxTeams}">
                            </div>
                        <div class="col-md-3">
                            <label class="form-label">Type</label>
                                <select name="type" class="form-select">
                                    <option th:each="type : ${types}" th:value="${type}" th:text="${type}"
                                            th:selected="${type == tournament.type}"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Points victoire</label>
                                <input type="number" name="pointsWin" class="form-control" min="0"
                                       th:value="${tournament.pointsWin}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Points nul</label>
                                <input type="number" name="pointsDraw" class="form-control" min="0"
                                       th:value="${tournament.pointsDraw}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Points défaite</label>
                                <input type="number" name="pointsLoss" class="form-control" min="0"
                                       th:value="${tournament.pointsLoss}">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Critères de départage</label>
                                <input type="text" name="tiebreakers" class="form-control"
                                       th:value="${tournament.tiebreakers}">
                            </div>
                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i> Enregistrer
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
