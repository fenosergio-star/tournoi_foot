<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Utilisateurs - Tournament Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <nav th:replace="~{fragments/sidebar :: sidebar('users')}"></nav>
    <div class="flex-grow-1" style="min-height: 100vh;">
        <main class="app-content">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="page-hero d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="hero-icon"><i class="fas fa-user-shield"></i></div>
                    <div>
                        <h1>Utilisateurs</h1>
                        <p>Gestion des comptes et des rôles — réservé aux administrateurs</p>
                    </div>
                </div>
                <button class="btn btn-light fw-semibold" type="button" data-bs-toggle="collapse" data-bs-target="#createUser">
                    <i class="fas fa-plus me-1"></i> Nouvel utilisateur
                </button>
            </div>

            <div th:classappend="${openCreateForm} ? 'show'" class="collapse mb-4" id="createUser">
                <div class="card">
                    <div class="card-header bg-white"><strong>Créer un utilisateur</strong></div>
                    <div class="card-body">
                        <form th:action="@{/admin/users/create}" th:object="${newUser}" method="post" class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Nom d'utilisateur</label>
                                <input type="text" class="form-control" th:field="*{username}"
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Mot de passe</label>
                                <input type="password" class="form-control" th:field="*{password}"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Rôle</label>
                                <select class="form-select" th:field="*{role}"
                                        th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                            </div>
                            <div class="col-md-1 d-flex align-items-end">
                                <button class="btn btn-success w-100" type="submit"><i class="fas fa-check"></i></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Utilisateur</th>
                            <th>Rôle</th>
                            <th>Créé le</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${users}">
                            <td>
                                <i class="fas fa-user-circle me-2 text-secondary"></i>
                                <span th:text="${u.username}"></span>
                                <span class="badge bg-success ms-1" th:if="${u.username == currentUsername}">vous</span>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${u.role.name() == 'ADMIN' ? 'bg-danger' : (u.role.name() == 'MANAGER' ? 'bg-warning text-dark' : (u.role.name() == 'OPERATOR' ? 'bg-info text-dark' : 'bg-secondary'))}"
                                      th:text="${u.role}">Rôle</span>
                            </td>
                            <td class="text-muted small" th:text="${u.createdAt}"></td>
                            <td>
                                <div class="d-flex justify-content-end align-items-center gap-2 flex-wrap">
                                    <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" class="d-flex gap-1">
                                        <select name="role" class="form-select form-select-sm" style="width:auto;">
                                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                                    th:selected="${r == u.role}"></option>
                                        </select>
                                        <button class="btn btn-sm btn-outline-primary" type="submit" title="Changer le rôle">
                                            <i class="fas fa-user-tag"></i>
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/users/{id}/password(id=${u.id})}" method="post"
                                          class="d-flex gap-1" onsubmit="return confirm('Réinitialiser le mot de passe ?');">
                                        <input type="password" name="newPassword" class="form-control form-control-sm"
                                               placeholder="Nouveau mot de passe" minlength="6" required style="width:170px;">
                                        <button class="btn btn-sm btn-outline-secondary" type="submit" title="Réinitialiser le mot de passe">
                                            <i class="fas fa-key"></i>
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                                          onsubmit="return confirm('Supprimer cet utilisateur ?');">
                                        <button class="btn btn-sm btn-outline-danger" type="submit"
                                                th:disabled="${u.username == currentUsername}" title="Supprimer">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="4" class="text-center text-muted py-4">Aucun utilisateur.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
