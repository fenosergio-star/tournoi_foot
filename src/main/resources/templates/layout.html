<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Manager - <span th:text="${title} ?: 'Accueil'">Accueil</span></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar {
            min-height: 100vh;
            background: #2d3436;
        }
        .sidebar .nav-link {
            color: #dfe6e9;
        }
        .sidebar .nav-link.active {
            background: #0984e3;
            color: white;
        }
        .sidebar .nav-link:hover {
            background: #636e72;
            color: white;
        }
        .brand {
            color: white;
            font-weight: bold;
            font-size: 1.3rem;
            padding: 1rem;
            text-align: center;
        }
        .card { border: none; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        .badge-status { font-size: 0.8rem; }
        .team-logo {
            width: 40px; height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
            display: flex; align-items: center; justify-content: center;
        }
        .elimination-match {
            position: relative;
            padding: 0.5rem;
        }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column flex-shrink-0 p-0" style="width: 220px;">
        <div class="brand">
            <i class="fas fa-trophy"></i> Tournament
        </div>
        <ul class="nav nav-pills flex-column mb-auto px-2">
            <li class="nav-item">
                <a th:classappend="${currentPage == 'dashboard'} ? 'active'" class="nav-link" th:href="@{/dashboard}">
                    <i class="fas fa-gauge-high me-2"></i> Tableau de bord
                </a>
            </li>
            <li class="nav-item">
                <a th:classappend="${currentPage == 'tournaments'} ? 'active'" class="nav-link" th:href="@{/tournaments}">
                    <i class="fas fa-trophy me-2"></i> Tournois
                </a>
            </li>
            <li class="nav-item">
                <a th:classappend="${currentPage == 'teams'} ? 'active'" class="nav-link" th:href="@{/teams}">
                    <i class="fas fa-users me-2"></i> Équipes
                </a>
            </li>
        </ul>
        <div class="px-3 py-3 border-top">
            <div class="text-white small mb-2" th:text="'Connecté : ' + ${#authentication.name}">
                Utilisateur
            </div>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm w-100" type="submit">
                    <i class="fas fa-sign-out-alt me-1"></i> Déconnexion
                </button>
            </form>
        </div>
    </div>

    <!-- Main content -->
    <div class="flex-grow-1" style="min-height: 100vh;">
        <main class="app-content">
            <!-- Flash messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:replace="~{::main-content}"></div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
