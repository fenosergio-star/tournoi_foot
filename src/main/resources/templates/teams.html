<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Équipes - Tournament Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <nav th:replace="~{fragments/sidebar :: sidebar('teams')}"></nav>
    <div class="flex-grow-1 app-main">
        <main class="app-content">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="page-hero d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="hero-icon"><i class="fas fa-users"></i></div>
                    <div>
                        <h1>Équipes</h1>
                        <p>Clubs, effectifs et encadrement</p>
                    </div>
                </div>
                <a th:if="${canManage}" th:href="@{/teams/new}" class="btn btn-light fw-semibold">
                    <i class="fas fa-plus me-1"></i> Nouvelle équipe
                </a>
            </div>

            <form th:action="@{/teams}" method="get" class="card mb-3">
                <div class="card-body row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label small mb-1" for="filterName">Nom</label>
                        <input id="filterName" type="text" name="name" class="form-control form-control-sm"
                               placeholder="Rechercher une équipe" th:value="${filterName}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-1" for="filterCountry">Pays</label>
                        <select id="filterCountry" name="country" class="form-select form-select-sm">
                            <option value="">Tous</option>
                            <option th:each="c : ${countries}" th:value="${c}" th:text="${c.label}"
                                    th:selected="${c == filterCountry}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-1" for="filterStatus">Statut</label>
                        <select id="filterStatus" name="status" class="form-select form-select-sm">
                            <option value="">Tous</option>
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                    th:selected="${s == filterStatus}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-1" for="filterSort">Trier par</label>
                        <select id="filterSort" name="sort" class="form-select form-select-sm">
                            <option value="name" th:selected="${sort == 'name'}">Nom</option>
                            <option value="city" th:selected="${sort == 'city'}">Ville</option>
                            <option value="country" th:selected="${sort == 'country'}">Pays</option>
                            <option value="status" th:selected="${sort == 'status'}">Statut</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <label class="form-label small mb-1" for="filterDirection">Ordre</label>
                        <select id="filterDirection" name="direction" class="form-select form-select-sm">
                            <option value="asc" th:selected="${direction == 'asc'}">Asc</option>
                            <option value="desc" th:selected="${direction == 'desc'}">Desc</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-sm flex-grow-1">
                            <i class="fas fa-filter me-1"></i> Filtrer
                        </button>
                        <a th:href="@{/teams}" class="btn btn-outline-secondary btn-sm" title="Réinitialiser">
                            <i class="fas fa-eraser"></i>
                        </a>
                    </div>
                </div>
            </form>

            <div class="row">
                <div class="col-md-4 mb-3" th:each="t : ${teams}">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="d-flex align-items-center mb-2">
                                <div class="team-logo me-2" th:text="${#strings.substring(t.name, 0, 1)}"></div>
                                <div>
                                    <h6 class="mb-0" th:text="${t.name}"></h6>
                                    <span class="text-muted small" th:text="${t.city}"></span>
                                    <span th:if="${t.country != null}" class="badge bg-light text-dark border ms-1"
                                          th:text="${t.country.label}"></span>
                                </div>
                            </div>
                            <div class="small mb-1">
                                <i class="fas fa-user-tie me-1"></i> Entraîneur : <span th:text="${t.coach}"></span>
                            </div>
                            <div class="small mb-2">
                                <i class="fas fa-users me-1"></i> Joueurs : <span th:text="${t.playerCount}"></span>
                                <span class="badge badge-status ms-1"
                                      th:classappend="${t.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${t.status}"></span>
                            </div>
                            <div class="d-flex gap-2">
                                <a th:href="@{/teams/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-eye"></i> Détail
                                </a>
                                <th:block th:if="${canManage}">
                                    <a th:href="@{/teams/{id}/edit(id=${t.id})}" class="btn btn-sm btn-outline-secondary">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <form th:action="@{/teams/{id}/delete(id=${t.id})}" method="post"
                                          onsubmit="return confirm('Supprimer cette équipe ?');">
                                        <button class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
                                    </form>
                                </th:block>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(teams)}" class="col-12 text-center text-muted py-4">
                    Aucune équipe enregistrée.
                </div>
            </div>

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-2"
                 th:if="${page.totalPages > 1}">
                <span class="text-muted small"
                      th:text="|Page ${page.number + 1} / ${page.totalPages} — ${page.totalElements} équipe(s)|"></span>
                <nav>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/teams(page=${page.number - 1}, size=${page.size}, name=${filterName}, country=${filterCountry}, status=${filterStatus}, sort=${sort}, direction=${direction})}">Précédent</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                            th:classappend="${i == page.number} ? 'active'">
                            <a class="page-link"
                               th:href="@{/teams(page=${i}, size=${page.size}, name=${filterName}, country=${filterCountry}, status=${filterStatus}, sort=${sort}, direction=${direction})}"
                               th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/teams(page=${page.number + 1}, size=${page.size}, name=${filterName}, country=${filterCountry}, status=${filterStatus}, sort=${sort}, direction=${direction})}">Suivant</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
