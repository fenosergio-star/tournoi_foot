<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Erreur - Tournament Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <nav th:replace="~{fragments/sidebar :: sidebar('')}"></nav>
    <div class="flex-grow-1 p-4 d-flex align-items-center justify-content-center" style="min-height:100vh;">
        <div class="text-center">
            <i class="fas fa-exclamation-triangle" style="font-size:4rem;color:#e17055;"></i>
            <h1 class="mt-3" th:text="${statusCode} ?: 'Erreur'"></h1>
            <h3 class="text-muted" th:text="${errorMessage} ?: 'Une erreur est survenue'"></h3>
            <a th:href="@{/dashboard}" class="btn btn-primary mt-3">
                <i class="fas fa-home me-1"></i> Retour à l'accueil
            </a>
        </div>
    </div>
</div>
</body>
</html>
