<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord - Tournament Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <nav th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></nav>
    <div class="flex-grow-1 app-main">
        <main class="app-content">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="page-hero hero-lg d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="hero-icon"><i class="fas fa-gauge-high"></i></div>
                    <div>
                        <h1>Tableau de bord</h1>
                        <p>Vue d'ensemble de vos tournois et compétitions</p>
                    </div>
                </div>
                <a th:if="${canManage}" th:href="@{/tournaments/new}" class="btn btn-light fw-semibold">
                    <i class="fas fa-plus me-1"></i> Nouveau tournoi
                </a>
            </div>

            <div class="row mb-4">
                <div class="col-md-3 mb-3">
                    <div class="stat-card" style="background: linear-gradient(135deg, #0ea5e9, #38bdf8);">
                        <div class="stat-number" th:text="${#lists.size(tournaments)}"></div>
                        <div class="stat-label">Tournois</div>
                        <i class="fas fa-trophy stat-icon"></i>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="stat-card" style="background: linear-gradient(135deg, #10b981, #059669);">
                        <div class="stat-number" th:text="${activeCount}"></div>
                        <div class="stat-label">Tournois actifs</div>
                        <i class="fas fa-calendar-check stat-icon"></i>
                    </div>
                </div>
                <div class="col-md-2 mb-3">
                    <div class="stat-card" style="background: linear-gradient(135deg, #6c5ce7, #a29bfe);">
                        <div class="stat-number" th:text="${teamCount}"></div>
                        <div class="stat-label">Équipes</div>
                        <i class="fas fa-users stat-icon"></i>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="text-muted mb-3"><i class="fas fa-bolt me-1"></i> Actions rapides</h6>
                            <div class="d-flex gap-2 flex-wrap">
                                <a th:if="${canManage}" th:href="@{/tournaments/new}" class="btn btn-primary btn-sm">
                                    <i class="fas fa-plus"></i> Nouveau tournoi
                                </a>
                                <a th:if="${canManage}" th:href="@{/teams/new}" class="btn btn-success btn-sm">
                                    <i class="fas fa-users"></i> Nouvelle équipe
                                </a>
                                <a th:href="@{/tournaments}" class="btn btn-outline-secondary btn-sm">
                                    Voir tous les tournois
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Tournois récents</h5>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Sport</th>
                            <th>Type</th>
                            <th>Dates</th>
                            <th>Statut</th>
                            <th>Équipes</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="t : ${tournaments}">
                            <td th:text="${t.name}"></td>
                            <td th:text="${t.sport}"></td>
                            <td th:text="${t.type}"></td>
                            <td th:text="${t.startDate} + ' → ' + ${t.endDate}"></td>
                            <td>
                                <span class="badge badge-status"
                                      th:classappend="|bg-${t.status.name() == 'BROUILLON' ? 'secondary' : t.status.name() == 'INSCRIPTION' ? 'info' : t.status.name() == 'PROGRAMME' ? 'primary' : t.status.name() == 'EN_COURS' ? 'warning' : t.status.name() == 'TERMINE' ? 'success' : 'danger'}|"
                                      th:text="${t.status}"></span>
                            </td>
                            <td th:text="${t.registeredTeams} + '/' + ${t.maxTeams}"></td>
                            <td>
                                <a th:href="@{/tournaments/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-eye"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(tournaments)}">
                            <td colspan="7" class="text-center text-muted py-4">
                                Aucun tournoi. <a th:href="@{/tournaments/new}">Créez votre premier tournoi</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
